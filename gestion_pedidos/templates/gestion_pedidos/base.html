<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Supermercado Express{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'catalogo' %}">🛒 Supermercado Express</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{% url 'catalogo' %}">Catálogo</a>
      <a class="nav-link" href="{% url 'registrar_pedido' %}">Nuevo pedido</a>
      <a class="nav-link" href="{% url 'dashboard' %}">Resumen</a>
      <a class="nav-link" href="/admin/">Administración</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ message }} <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
